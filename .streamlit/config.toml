# Visual theme — purple instead of Streamlit's default red (which reads as "error").
# Light AND dark are both defined, so the app follows the device setting and the user can still
# switch in ⋮ → Settings. Don't set `base` here: that forces one mode for everyone.
# The job-card styles in app.py (CSS / PALETTES) follow whichever mode is active.

[theme]
headingFontSizes = ["2rem", "1.55rem", "1.25rem", "1.05rem"]
metricValueFontSize = "1.7rem"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#4B2E83"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F4FB"
textColor = "#1F2937"
linkColor = "#4B2E83"
borderColor = "#E7E3F1"

[theme.light.sidebar]
backgroundColor = "#F6F4FB"

[theme.dark]
primaryColor = "#A78BDA"
backgroundColor = "#0F0E17"
secondaryBackgroundColor = "#1B1A26"
textColor = "#E5E7EB"
linkColor = "#C4B5FD"
borderColor = "#2E2B40"

[theme.dark.sidebar]
backgroundColor = "#15141F"
